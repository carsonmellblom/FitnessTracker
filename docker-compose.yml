version: '3.8'

services:
  photo-processor:
    build:
      context: ./services/photo-processor
      dockerfile: Dockerfile
    container_name: fitness-photo-processor
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST:-host.docker.internal}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - UPLOADS_PATH=/app/uploads
    volumes:
      # Mount the uploads folder so processor can access photos
      - ./src/FitnessTracker.API/uploads:/app/uploads
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

# Note: RabbitMQ and PostgreSQL are running locally (not in this compose file)
# The photo-processor connects to them via host.docker.internal
